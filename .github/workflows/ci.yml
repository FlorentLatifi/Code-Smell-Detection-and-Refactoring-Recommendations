name: CI

# Every push is checked, not just pull requests: this repository is worked on
# directly on `main`, so a push is the only moment a regression can be caught
# before it becomes the state the thesis is written against.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Pinned to the version used locally; a metric that silently changes
          # value across interpreter versions would invalidate published results.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            docs/thesis/requirements.txt

      # The thesis requirements are installed here too, and only for one reason:
      # this job type-checks `scripts/`, and `build_figures.py` imports
      # matplotlib, which is pinned there because it draws the thesis figures.
      # Checking a script without its dependencies checks less than it appears
      # to -- the import resolves to Any and every call through it stops being
      # verified -- so the job that checks those scripts installs what they use.
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt -r ../docs/thesis/requirements.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      # The experiment scripts live outside the package but produce the numbers
      # in the Results chapter, so they are held to the same standard.
      - name: Lint experiment scripts
        working-directory: .
        run: |
          ruff check scripts --config backend/pyproject.toml
          ruff format --check scripts --config backend/pyproject.toml

      - name: Type check
        run: mypy

      # The scripts produce every number in the Results chapter, so they are held
      # to the package's own standard. Run from `backend` so `javasmell` resolves
      # the way the scripts resolve it at runtime.
      - name: Type check experiment scripts
        run: mypy ../scripts

      - name: Tests
        run: pytest -q --cov --cov-report=term-missing

  # The analysed language must be present for the refactoring engine's
  # verification step (Phase 3). Kept as a separate, cheap job so that a JDK
  # problem is distinguishable from a Python one at a glance.
  toolchain:
    name: Java toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: javac -version

  # The prose and the reference list are edited separately and drift silently:
  # the template allows only cited sources under Referencat, so a citation dropped
  # while editing leaves a reference that breaks the format. The layout rules are
  # checked on the built file for the same reason. Its own job because a thesis
  # formatting failure is not a code failure.
  thesis:
    name: Thesis (citations, format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/thesis/requirements.txt
      - name: Install dependencies
        run: pip install -r docs/thesis/requirements.txt
      - name: Check citations
        working-directory: docs/thesis
        run: python check_citations.py

      - name: Build the document
        working-directory: docs/thesis
        run: python build_thesis.py

      - name: Check formatting
        working-directory: docs/thesis
        run: python check_format.py

  # The interface is typed, so a broken contract with the API surfaces here
  # rather than in a browser. Kept separate from the Python job for the same
  # reason the toolchain job is: a failure should name its own cause.
  frontend:
    name: Frontend (types, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Type check
        working-directory: frontend
        run: npm run typecheck
      - name: Build
        working-directory: frontend
        run: npm run build
