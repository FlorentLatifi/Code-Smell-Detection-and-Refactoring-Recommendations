name: Docker

# Imazhi publikohet te GitHub Container Registry, që përdoruesi ta nisë me një
# komandë pa ndërtuar asgjë (VD-142). Te pull request-et ndërtohet dhe provohet pa
# u publikuar: kështu një imazh i prishur kapet para se të bashkohet (VD-156).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Ndërto dhe publiko imazhin
    # E fiksuar për të njëjtën arsye si puna e2e te `ci.yml` (VD-154, VD-156).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Hyrja te ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Emri i imazhit në ghcr.io duhet me shkronja të vogla, ndërsa emri i depos
      # nuk është; metadata-action e bën këtë dhe shton etiketat `latest` dhe vN.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      # Imazhi ndërtohet një herë lokalisht dhe niset para se të publikohet: një
      # imazh që ndërtohet por nuk niset nuk duhet të arrijë te ghcr.io (VD-156).
      - name: Ndërto imazhin për provë
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: javasmell:prova
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Te një etiketë `vN`, `/api/health` duhet ta raportojë atë version.
      # Etiketa kalon nga mjedisi dhe jo brenda komandës, që emri të mos lexohet
      # si kod shell-i.
      - name: Provo imazhin e ndezur
        env:
          EXPECTED_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: bash tools/prova-imazhit.sh javasmell:prova "$EXPECTED_VERSION"

      # Shtresat vijnë nga cache-i i hapit të parë, ndaj ky ndërtim nuk përsëritet.
      - name: Publiko imazhin
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
